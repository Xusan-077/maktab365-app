<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="font-size:20px;font-weight:bold;color:#1d4ed8;padding-bottom:24px;">maktab365</td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:24px;padding-bottom:8px;font-weight:bold;">{{ greeting }}</td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:24px;padding-bottom:24px;">{{ text }}</td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;font-size:32px;letter-spacing:8px;font-weight:bold;color:#1d4ed8;">{{ code }}</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:20px;color:#4b5563;padding-bottom:16px;">{{ expires }}</td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:20px;color:#6b7280;">{{ ignore }}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
