          type: string
          minLength: 1
          maxLength: 64
        attempts:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1
        last_wrong_at:
          type: string
          format: date-time
          nullable: true
      required:
      - exercise_id
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
