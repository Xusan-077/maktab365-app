components:
  schemas:
    AdminDashboard:
      type: object
      properties:
        pdf_books:
          $ref: '#/components/schemas/BookCounts'
        subjects_count:
          type: integer
        new_messages:
          type: integer
        recent_messages:
          type: array
          items:
            $ref: '#/components/schemas/RecentMessage'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
      - new_messages
      - pdf_books
      - recent_activity
      - recent_messages
      - subjects_count
    Annotation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pdf_book_id:
          type: string
          format: uuid
          readOnly: true
        page:
          type: integer
          readOnly: true
        color:
          allOf:
          - $ref: '#/components/schemas/ColorEnum'
          readOnly: true
        rects:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationRect'
          readOnly: true
        note:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
