          type: string
          minLength: 1
          maxLength: 60
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        grade:
          type: integer
          maximum: 11
          minimum: 1
        subjects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 30
        grades:
          type: array
          items:
            type: integer
            maximum: 11
            minimum: 1
          maxItems: 11
      required:
      - display_name
      - role
