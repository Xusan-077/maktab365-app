openapi: 3.0.3
info:
  title: Maktab365 API
  version: 0.1.0
  description: Maktab365 platformasi API'si.
paths:
  /api/v1/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_delete
      summary: Akkauntni o'chirish (soft delete + anonimlashtirish)
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/onboarding/:
    post:
      operationId: me_onboarding
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/role/:
    patch:
      operationId: me_role_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/export/:
    get:
      operationId: me_export
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
  /api/v1/me/identities/:
    get:
      operationId: me_identities_list
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
          description: ''
  /api/v1/me/identities/{identity_id}/:
    delete:
      operationId: me_identities_delete
      summary: Kirish usulini o'chirish (oxirgisini o'chirib bo'lmaydi)
      parameters:
      - in: path
        name: identity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/identities/{provider}/:
    post:
      operationId: me_identities_link
      summary: Kirish usulini ulash (google | telegram | email_otp)
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
          description: ''
  /api/v1/me/password/set/:
    post:
      operationId: me_password_set
      summary: Parolsiz akkaunt uchun parol o'rnatish
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Google id_token orqali kirish/ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/telegram/:
    post:
      operationId: auth_telegram
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Telegram Login Widget orqali kirish/ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Emailga 6 xonali kod yuborish (60 soniyada bir marta)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Email kodi orqali kirish/ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Refresh tokenni bekor qilish (idempotent)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all
      summary: Barcha qurilmalardagi sessiyalarni bekor qilish
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend
      summary: Tasdiqlash xatini qayta yuborish (60 soniyada bir marta)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Parol tiklash xati (akkaunt bor-yo'qligidan qat'i nazar doim 200)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      summary: Parolni almashtirish; joriy sessiyadan boshqa refresh tokenlar bekor
        qilinadi
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/health/:
    get:
      operationId: health
      summary: Servis holati (DB va Redis)
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/grades/:
    get:
      operationId: grades_list
      description: Ochiq (loginsiz) o'qish uchun umumiy sozlama; tezlik chegarasi
        o'rniga kesh ishlaydi.
      summary: Sinflar (1–11) va ulardagi kitoblar soni
      tags:
      - content
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
          description: ''
  /api/v1/subjects/:
    get:
      operationId: subjects_list
      description: Ochiq (loginsiz) o'qish uchun umumiy sozlama; tezlik chegarasi
        o'rniga kesh ishlaydi.
      summary: 'Kitobi bor fanlar (ixtiyoriy: sinf bo''yicha)'
      parameters:
      - in: query
        name: grade
        schema:
          type: integer
        description: Sinf (1–11)
      tags:
      - content
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
          description: ''
  /api/v1/books/:
    get:
      operationId: books_list
      description: Ochiq (loginsiz) o'qish uchun umumiy sozlama; tezlik chegarasi
        o'rniga kesh ishlaydi.
      summary: Kitoblar (sahifalangan)
      parameters:
      - in: query
        name: grade
        schema:
          type: integer
        description: Sinf (1–11)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Kitob nomi/muallifi bo'yicha
      - in: query
        name: subject
        schema:
          type: string
        description: Fan slug'i
      - in: query
        name: topics_ready
        schema:
          type: boolean
        description: Mavzulari bor/yo'q kitoblar
      tags:
      - content
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookList'
          description: ''
  /api/v1/books/{slug}/:
    get:
      operationId: books_retrieve
      description: Ochiq (loginsiz) o'qish uchun umumiy sozlama; tezlik chegarasi
        o'rniga kesh ishlaydi.
      summary: 'Kitob: boblar va mavzular ro''yxati (bloklarsiz)'
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - content
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/books/{book}/topics/{topic}/:
    get:
      operationId: topics_retrieve
      description: Ochiq (loginsiz) o'qish uchun umumiy sozlama; tezlik chegarasi
        o'rniga kesh ishlaydi.
      summary: 'Mavzu: to''liq bloklar, oldingi/keyingi mavzu, breadcrumb'
      parameters:
      - in: path
        name: book
        schema:
          type: string
        required: true
      - in: path
        name: topic
        schema:
          type: string
        required: true
      tags:
      - content
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
          description: ''
  /api/v1/search/:
    get:
      operationId: search_topics
      description: Ochiq (loginsiz) o'qish uchun umumiy sozlama; tezlik chegarasi
        o'rniga kesh ishlaydi.
      summary: Mavzular bo'yicha qidiruv (lotin va kirill)
      parameters:
      - in: query
        name: book
        schema:
          type: string
        description: Kitob slug'i
      - in: query
        name: grade
        schema:
          type: integer
        description: Sinf (1–11)
      - in: query
        name: limit
        schema:
          type: integer
        description: Eng ko'pi 50 ta
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - ru
          - uz
        description: Til (yoki Accept-Language); hozir faqat qidiruv snippetini tanlaydi.
      - in: query
        name: q
        schema:
          type: string
        description: Qidiruv so'rovi
        required: true
      - in: query
        name: subject
        schema:
          type: string
        description: Fan slug'i
      tags:
      - content
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
  /api/v1/me/progress/:
    get:
      operationId: me_progress_list
      parameters:
      - in: query
        name: book
        schema:
          type: string
        description: Kitob slug'i
      - in: query
        name: exercise_status
        schema:
          type: string
      - in: query
        name: needs_review
        schema:
          type: boolean
        description: Faqat xatosi borlar
      - in: query
        name: read_status
        schema:
          type: string
      - in: query
        name: topic
        schema:
          type: string
        description: Mavzu kaliti
      tags:
      - learning
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicProgress'
          description: ''
  /api/v1/me/progress/{topic_id}/:
    get:
      operationId: me_progress_retrieve
      parameters:
      - in: path
        name: topic_id
        schema:
          type: string
        required: true
      tags:
      - learning
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicProgress'
          description: ''
    put:
      operationId: me_progress_update
      summary: Mavzu progressini yozish (idempotent, monoton)
      parameters:
      - in: path
        name: topic_id
        schema:
          type: string
        required: true
      tags:
      - learning
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProgressWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProgressWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicProgress'
          description: ''
  /api/v1/me/events/:
    post:
      operationId: me_events_create
      summary: 'O''qish voqeasi: topic_opened | topic_read | exercise_answered'
      tags:
      - learning
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicProgress'
          description: ''
  /api/v1/me/bookmarks/:
    get:
      operationId: me_bookmarks_list
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - book
          - topic
      tags:
      - learning
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bookmark'
          description: ''
    post:
      operationId: me_bookmarks_create
      summary: Xatcho'p qo'yish (takror yuborilsa 200)
      tags:
      - learning
      requestBody:
        content:
          application/json:
            schema:
