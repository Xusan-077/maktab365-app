      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderEnum'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - provider
      - verified
    IdentityList:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        has_password:
          type: boolean
      required:
      - has_password
      - identities
