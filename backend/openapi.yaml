components:
  schemas:
    AuthSession:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        is_new:
          type: boolean
      required:
      - access
      - is_new
      - refresh
      - user
    AuthTokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    Book:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        subject:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        grade:
          type: integer
        title:
          $ref: '#/components/schemas/LocalizedText'
        author:
          $ref: '#/components/schemas/LocalizedText'
        publisher:
          type: string
        edition:
          $ref: '#/components/schemas/LocalizedText'
        year:
          type: integer
        cover:
          type: string
          format: uri
          nullable: true
        pdf:
          type: string
          format: uri
          nullable: true
        topics_ready:
          type: boolean
          readOnly: true
        topics_count:
          type: integer
      required:
      - author
      - cover
      - edition
      - grade
      - pdf
      - publisher
      - slug
      - subject
      - title
      - topics_count
      - topics_ready
      - year
    BookDetail:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        subject:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        grade:
          type: integer
        title:
          $ref: '#/components/schemas/LocalizedText'
        author:
          $ref: '#/components/schemas/LocalizedText'
        publisher:
          type: string
        edition:
          $ref: '#/components/schemas/LocalizedText'
        year:
          type: integer
        cover:
          type: string
          format: uri
          nullable: true
        pdf:
          type: string
          format: uri
          nullable: true
        topics_ready:
          type: boolean
          readOnly: true
        topics_count:
          type: integer
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
      required:
      - author
      - chapters
      - cover
      - edition
      - grade
      - pdf
      - publisher
      - slug
      - subject
      - title
      - topics_count
      - topics_ready
      - year
    Bookmark:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          $ref: '#/components/schemas/BookmarkKindEnum'
        topic_id:
          type: string
          nullable: true
          readOnly: true
        book_id:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book_id
      - created_at
      - id
      - kind
      - topic_id
    BookmarkKindEnum:
      enum:
      - book
      - topic
      type: string
      description: |-
        * `book` - Book
        * `topic` - Topic
    BookmarkWriteRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BookmarkKindEnum'
        topic_id:
          type: string
          minLength: 1
          maxLength: 200
        book_id:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - kind
    Breadcrumb:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/BreadcrumbSubject'
        book:
          $ref: '#/components/schemas/BreadcrumbBook'
        chapter:
          $ref: '#/components/schemas/BreadcrumbChapter'
      required:
      - book
      - chapter
      - subject
    BreadcrumbBook:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          $ref: '#/components/schemas/LocalizedText'
        grade:
          type: integer
      required:
      - grade
      - slug
      - title
    BreadcrumbChapter:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        order:
          type: integer
        title:
          $ref: '#/components/schemas/LocalizedText'
      required:
      - order
      - slug
      - title
    BreadcrumbSubject:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          $ref: '#/components/schemas/LocalizedText'
      required:
      - slug
      - title
    Chapter:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        order:
          type: integer
        title:
          $ref: '#/components/schemas/LocalizedText'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicSummary'
      required:
      - order
      - slug
      - title
      - topics
    CheckStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    Dashboard:
      type: object
      properties:
        continue:
          allOf:
          - $ref: '#/components/schemas/TopicProgress'
          nullable: true
        has_progress:
          type: boolean
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/DashboardBook'
        review:
          $ref: '#/components/schemas/ReviewSummary'
        weekly:
          $ref: '#/components/schemas/Weekly'
        saved_count:
          type: integer
      required:
      - continue
      - has_progress
      - review
      - saved_count
      - subjects
      - weekly
    DashboardBook:
      type: object
      properties:
        book_id:
          type: string
        subject_id:
          type: string
        grade:
          type: integer
        topics_total:
          type: integer
        topics_read:
          type: integer
        topics_passed:
          type: integer
      required:
      - book_id
      - grade
      - subject_id
      - topics_passed
      - topics_read
      - topics_total
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    EventRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        topic_id:
          type: string
          minLength: 1
          maxLength: 200
        exercise_id:
          type: string
          minLength: 1
          maxLength: 64
        correct:
          type: boolean
        attempt:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1
        last_block_id:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - topic_id
      - type
    ExerciseStats:
      type: object
      properties:
        solved:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 500
        attempts:
          type: object
          additionalProperties:
            type: integer
            maximum: 10000
            minimum: 0
    ExerciseStatsRequest:
      type: object
      properties:
        solved:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 500
        attempts:
          type: object
          additionalProperties:
            type: integer
            maximum: 10000
            minimum: 0
    ExerciseStatusEnum:
      enum:
      - not_started
      - in_progress
      - passed
      type: string
      description: |-
        * `not_started` - Not started
        * `in_progress` - In progress
        * `passed` - Passed
    Export:
      type: object
      properties:
        exported_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/ExportUser'
        profile:
          $ref: '#/components/schemas/Profile'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/ExportIdentity'
        auth_events:
          type: array
          items:
            $ref: '#/components/schemas/ExportEvent'
        learning:
          $ref: '#/components/schemas/ExportLearning'
      required:
      - auth_events
      - exported_at
      - identities
      - learning
      - profile
      - user
    ExportEvent:
      type: object
      properties:
        type:
          type: string
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
        meta:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - ip
      - meta
      - type
      - user_agent
    ExportIdentity:
      type: object
      properties:
        provider:
          type: string
        provider_uid:
          type: string
        email:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - provider
      - provider_uid
      - verified
    ExportLearning:
      type: object
      properties:
        progress:
          type: array
          items:
            $ref: '#/components/schemas/TopicProgress'
        bookmarks:
          type: array
          items:
            $ref: '#/components/schemas/Bookmark'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/StudyGoal'
      required:
      - bookmarks
      - goals
      - progress
    ExportUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        role:
          type: string
        date_joined:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - date_joined
      - email
      - email_verified_at
      - id
      - last_login
      - role
    GoogleAuthRequest:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        id_token:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - id_token
    Grade:
      type: object
      properties:
        grade:
          type: integer
          maximum: 11
          minimum: 1
        books_count:
          type: integer
      required:
      - books_count
      - grade
    GuestProgressRequest:
      type: object
      description: 'PUT: to''liq holat. Yuborilmagan maydonga tegilmaydi.'
      properties:
        read_status:
          $ref: '#/components/schemas/ReadStatusEnum'
        exercise_status:
          $ref: '#/components/schemas/ExerciseStatusEnum'
        last_block_id:
          type: string
          maxLength: 64
        scroll_position:
          type: number
          format: double
          maximum: 1
          minimum: 0
          nullable: true
        mistakes:
          type: array
          items:
            $ref: '#/components/schemas/MistakeRequest'
        exercise_stats:
          $ref: '#/components/schemas/ExerciseStatsRequest'
        updated_at:
          type: string
          format: date-time
        topic_id:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - topic_id
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        checks:
          $ref: '#/components/schemas/HealthChecks'
      required:
      - checks
      - status
    HealthChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckStatusEnum'
        redis:
          $ref: '#/components/schemas/CheckStatusEnum'
      required:
      - database
      - redis
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
