      type: object
      properties:
        grade:
          type: integer
        books_total:
          type: integer
        books_opened:
          type: integer
      required:
      - books_opened
      - books_total
      - grade
    TelegramAuthRequest:
      type: object
      description: Telegram Login Widget qaytargan maydonlar (imzo tekshiruvi providers/telegram.py
        da).
      properties:
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        id:
          type: integer
          minimum: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        username:
          type: string
          minLength: 1
          maxLength: 255
        photo_url:
          type: string
          minLength: 1
          maxLength: 500
        auth_date:
          type: integer
          minimum: 1
        hash:
          type: string
          minLength: 1
          pattern: ^[0-9a-fA-F]{64}$
      required:
      - auth_date
      - first_name
      - hash
      - id
    TelegramLoginCompleteRequest:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        token:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9_-]{16,64}$
      required:
      - token
    TelegramLoginSession:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        is_new:
          type: boolean
        profile_completed:
          type: boolean
      required:
      - access
      - is_new
      - profile_completed
      - refresh
      - user
    TelegramLoginStart:
      type: object
      properties:
        token:
          type: string
        bot_url:
          type: string
          format: uri
        expires_in:
          type: integer
        nonce:
          type: string
      required:
      - bot_url
      - expires_in
      - nonce
      - token
    TelegramLoginStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TelegramLoginStatusStatusEnum'
      required:
      - status
    TelegramLoginStatusStatusEnum:
      enum:
      - pending
      - confirmed
      - expired
      type: string
      description: |-
        * `pending` - pending
        * `confirmed` - confirmed
        * `expired` - expired
    ToEnum:
      enum:
      - draft
      - published
      type: string
      description: |-
        * `draft` - draft
        * `published` - published
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - token
    UploadRequestKindEnum:
      enum:
      - cover
      - image
      - pdf
      type: string
      description: |-
        * `cover` - cover
        * `image` - image
        * `pdf` - pdf
    UploadRequestRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        kind:
          $ref: '#/components/schemas/UploadRequestKindEnum'
      required:
      - file
      - kind
    UploadResult:
      type: object
      properties:
        path:
          type: string
        url:
          type: string
        name:
          type: string
        size:
          type: integer
        content_type:
          type: string
      required:
      - content_type
      - name
      - path
      - size
      - url
    UserAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_env_admin:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - display_name
      - email
      - id
      - is_active
      - is_env_admin
      - role
    UserAdminCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        display_name:
          type: string
          maxLength: 60
        password:
          type: string
          writeOnly: true
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - role
    UserAdminCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_env_admin:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        temporary_password:
          type: string
          readOnly: true
          nullable: true
          description: Parol berilmasa yaratilgan vaqtinchalik parol (faqat shu javobda,
            bir marta).
      required:
      - date_joined
      - display_name
      - email
      - id
      - is_active
      - is_env_admin
      - role
      - temporary_password
    Week:
      type: object
      properties:
        opened:
          type: integer
          description: Shu hafta birinchi marta ochilgan kitoblar
        read:
          type: integer
          description: Shu hafta oxirigacha o'qilgan kitoblar
      required:
      - opened
      - read
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
