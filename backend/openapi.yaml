openapi: 3.0.3
info:
  title: Darslik365 API
  version: 0.1.0
  description: Darslik365 platformasi API'si.
paths:
  /api/v1/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_delete
      summary: Akkauntni o'chirish (soft delete + anonimlashtirish)
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/onboarding/:
    post:
      operationId: me_onboarding
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/role/:
    patch:
      operationId: me_role_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/export/:
    get:
      operationId: me_export
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
  /api/v1/me/identities/:
    get:
      operationId: me_identities_list
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityList'
          description: ''
  /api/v1/me/identities/{identity_id}/:
    delete:
      operationId: me_identities_delete
      summary: Kirish usulini o'chirish (oxirgisini o'chirib bo'lmaydi)
      parameters:
      - in: path
        name: identity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/identities/{provider}/:
    post:
      operationId: me_identities_link
      summary: Kirish usulini ulash (google | telegram | email_otp)
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkIdentityRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
          description: ''
  /api/v1/me/password/set/:
    post:
      operationId: me_password_set
      summary: Parolsiz akkaunt uchun parol o'rnatish
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordSetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Google id_token orqali kirish/ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/telegram/:
    post:
      operationId: auth_telegram
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Telegram Login Widget orqali kirish/ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/telegram/start/:
    post:
      operationId: auth_telegram_start
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: 'Telegram bot orqali kirish: bir martalik havola (5 daqiqa)'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLoginStart'
          description: ''
  /api/v1/auth/telegram/status/:
    get:
      operationId: auth_telegram_status
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Telegram orqali kirish holati (pending | confirmed | expired)
      parameters:
      - in: header
        name: X-Telegram-Nonce
        schema:
          type: string
        description: '`start` bergan nonce (yoki `tg_nonce` cookie''si).'
      - in: query
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLoginStatus'
          description: ''
  /api/v1/auth/telegram/complete/:
    post:
      operationId: auth_telegram_complete
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Tasdiqlangan Telegram kirishini sessiyaga almashtirish (token bir martalik)
      parameters:
      - in: header
        name: X-Telegram-Nonce
        schema:
          type: string
        description: '`start` bergan nonce (yoki `tg_nonce` cookie''si).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLoginCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramLoginCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramLoginCompleteRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLoginSession'
          description: ''
  /api/v1/auth/telegram/webhook/:
    post:
      operationId: auth_telegram_webhook
      description: 'Faqat Telegram: `X-Telegram-Bot-Api-Secret-Token` = `TELEGRAM_WEBHOOK_SECRET`.'
      summary: Telegram bot webhook'i (/start <token>)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Emailga 6 xonali kod yuborish (60 soniyada bir marta)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Email kodi orqali kirish/ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Refresh tokenni bekor qilish (idempotent)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all
      summary: Barcha qurilmalardagi sessiyalarni bekor qilish
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend
      summary: Tasdiqlash xatini qayta yuborish (60 soniyada bir marta)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Parol tiklash xati (akkaunt bor-yo'qligidan qat'i nazar doim 200)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      summary: Parolni almashtirish; joriy sessiyadan boshqa refresh tokenlar bekor
        qilinadi
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/health/:
    get:
      operationId: health
      summary: Servis holati (DB va Redis)
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/admin/dashboard/:
    get:
      operationId: admin_dashboard
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/admin/stats/:
    get:
      operationId: admin_stats
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          enum:
          - 30
          - 7
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
          description: ''
  /api/v1/admin/uploads/:
    post:
      operationId: admin_uploads_create
      tags:
      - admin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
          description: ''
  /api/v1/admin/subjects/:
    get:
      operationId: admin_subjects_list
      description: 'Audit bilan CRUD: editor/admin yaratadi va tahrirlaydi, o''chirish
        — faqat admin.'
      parameters:
      - in: query
        name: grade
        schema:
          type: integer
        description: Sinf (1–11)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjectAdminList'
          description: ''
    post:
      operationId: admin_subjects_create
      description: 'Audit bilan CRUD: editor/admin yaratadi va tahrirlaydi, o''chirish
        — faqat admin.'
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubjectAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubjectAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectAdmin'
          description: ''
  /api/v1/admin/subjects/{id}/:
    get:
      operationId: admin_subjects_retrieve
      description: 'Audit bilan CRUD: editor/admin yaratadi va tahrirlaydi, o''chirish
        — faqat admin.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this subject.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectAdmin'
          description: ''
    patch:
      operationId: admin_subjects_update
      description: 'Audit bilan CRUD: editor/admin yaratadi va tahrirlaydi, o''chirish
        — faqat admin.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this subject.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubjectAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubjectAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubjectAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectAdmin'
          description: ''
    delete:
      operationId: admin_subjects_delete
      description: 'Audit bilan CRUD: editor/admin yaratadi va tahrirlaydi, o''chirish
        — faqat admin.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this subject.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: Foydalanuvchilar boshqaruvi — faqat admin.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
