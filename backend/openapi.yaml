components:
  schemas:
    AdminDashboard:
      type: object
      properties:
        pdf_books:
          $ref: '#/components/schemas/BookCounts'
        subjects_count:
          type: integer
        new_messages:
          type: integer
        recent_messages:
          type: array
          items:
            $ref: '#/components/schemas/RecentMessage'
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
      - new_messages
      - pdf_books
      - recent_activity
      - recent_messages
      - subjects_count
    Annotation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        pdf_book_id:
          type: string
          format: uuid
          readOnly: true
        page:
          type: integer
          readOnly: true
        color:
          allOf:
          - $ref: '#/components/schemas/ColorEnum'
          readOnly: true
        rects:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationRect'
          readOnly: true
        note:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - color
      - id
      - note
      - page
      - pdf_book_id
      - rects
      - updated_at
    AnnotationRect:
      type: object
      properties:
        x:
          type: number
          format: double
          maximum: 1
          minimum: 0
        y:
          type: number
          format: double
          maximum: 1
          minimum: 0
        w:
          type: number
          format: double
          maximum: 1
          minimum: 0
        h:
          type: number
          format: double
          maximum: 1
          minimum: 0
      required:
      - h
      - w
      - x
      - y
    AnnotationRectRequest:
      type: object
      properties:
        x:
          type: number
          format: double
          maximum: 1
          minimum: 0
        y:
          type: number
          format: double
          maximum: 1
          minimum: 0
        w:
          type: number
          format: double
          maximum: 1
          minimum: 0
        h:
          type: number
          format: double
          maximum: 1
          minimum: 0
      required:
      - h
      - w
      - x
      - y
    AnnotationWriteRequest:
      type: object
      description: 'PUT: belgi (`id` yo''lda, mijozda yaratilgan UUID).'
      properties:
        pdf_book_id:
          type: string
          minLength: 1
          maxLength: 64
        page:
          type: integer
          maximum: 100000
          minimum: 1
        color:
          $ref: '#/components/schemas/ColorEnum'
        rects:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationRectRequest'
        note:
          type: string
          default: ''
          maxLength: 200
      required:
      - color
      - page
      - pdf_book_id
      - rects
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_label:
          type: string
          maxLength: 254
        action:
          type: string
          maxLength: 32
        target_type:
          type: string
          maxLength: 32
        target_id:
          type: string
          maxLength: 64
        target_label:
          type: string
          maxLength: 200
        before:
          nullable: true
        after:
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
      - target_type
    AuthSession:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        is_new:
          type: boolean
      required:
      - access
      - is_new
      - refresh
      - user
    AuthTokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    BlankEnum:
      enum:
      - ''
    BookCounts:
      type: object
      properties:
        total:
          type: integer
        draft:
          type: integer
        published:
          type: integer
      required:
      - draft
      - published
      - total
    BotBook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
          description: So'ralgan tildagi nom (yo'q bo'lsa `uz`)
        grade:
          type: integer
        subject:
          type: string
          description: So'ralgan tildagi fan nomi
        page_count:
          type: integer
        size_bytes:
          type: integer
        url:
          type: string
          format: uri
          description: Kitob sahifasi
        read_url:
          type: string
          format: uri
          description: Onlayn o'qish oynasi
      required:
      - grade
      - id
      - page_count
      - read_url
      - size_bytes
      - slug
      - subject
      - title
      - url
    Chapter:
      type: object
      description: 'Yuqori daraja; `children` — ichki bo''limlar (ular uchun `children`
        yo''q: 2 daraja).'
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        page:
          type: integer
        slides:
          allOf:
          - $ref: '#/components/schemas/SlidesAdmin'
          readOnly: true
          nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChapterLeaf'
      required:
      - page
      - slides
      - title
    ChapterHit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        page:
          type: integer
        book:
          $ref: '#/components/schemas/ChapterHitBook'
      required:
      - book
      - id
      - page
      - title
    ChapterHitBook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        grade:
          type: integer
        title:
          $ref: '#/components/schemas/LocalizedText'
      required:
      - grade
      - id
      - slug
      - title
    ChapterLeaf:
      type: object
      description: |-
        Mundarija qatori. Qiymatlar `pdf_services.chapter_errors` da tekshiriladi.

        `id` yozishda ixtiyoriy: berilsa shu bo'lim joyida yangilanadi (prezentatsiyasi saqlanadi),
        berilmasa yangi bo'lim yaratiladi. `slides` faqat o'qiladi.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        page:
          type: integer
        slides:
          allOf:
          - $ref: '#/components/schemas/SlidesAdmin'
          readOnly: true
          nullable: true
      required:
      - page
      - slides
      - title
