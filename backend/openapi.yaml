openapi: 3.0.3
info:
  title: Maktab365 API
  version: 0.1.0
  description: Maktab365 platformasi API'si.
paths:
  /api/v1/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_delete
      summary: Akkauntni o'chirish (soft delete + anonimlashtirish)
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/onboarding/:
    post:
      operationId: me_onboarding
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/role/:
    patch:
      operationId: me_role_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/export/:
    get:
      operationId: me_export
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Refresh tokenni bekor qilish (idempotent)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all
      summary: Barcha qurilmalardagi sessiyalarni bekor qilish
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend
      summary: Tasdiqlash xatini qayta yuborish (60 soniyada bir marta)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      summary: Parol tiklash xati (akkaunt bor-yo'qligidan qat'i nazar doim 200)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset
      description: 'Kirmagan foydalanuvchi uchun: eskirgan `Authorization` sarlavhasi
        so''rovni buzmasin.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change
      summary: Parolni almashtirish; joriy sessiyadan boshqa refresh tokenlar bekor
        qilinadi
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/health/:
    get:
      operationId: health
      summary: Servis holati (DB va Redis)
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    AuthSession:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/Me'
        is_new:
          type: boolean
      required:
      - access
      - is_new
      - refresh
      - user
    AuthTokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    CheckStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Export:
      type: object
      properties:
        exported_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/ExportUser'
        profile:
          $ref: '#/components/schemas/Profile'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/ExportIdentity'
        auth_events:
          type: array
          items:
            $ref: '#/components/schemas/ExportEvent'
      required:
      - auth_events
      - exported_at
      - identities
      - profile
      - user
    ExportEvent:
      type: object
      properties:
        type:
          type: string
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
        meta:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - ip
      - meta
      - type
      - user_agent
    ExportIdentity:
      type: object
      properties:
        provider:
          type: string
        provider_uid:
          type: string
        email:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - provider
      - provider_uid
      - verified
    ExportUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          nullable: true
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        role:
          type: string
        date_joined:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
      required:
      - date_joined
      - email
      - email_verified_at
      - id
      - last_login
      - role
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        checks:
          $ref: '#/components/schemas/HealthChecks'
      required:
      - checks
      - status
    HealthChecks:
      type: object
      properties:
        database:
          $ref: '#/components/schemas/CheckStatusEnum'
        redis:
          $ref: '#/components/schemas/CheckStatusEnum'
      required:
      - database
      - redis
    LocaleEnum:
      enum:
      - uz
      - uz-Cyrl
      - ru
      - en
      type: string
      description: |-
        * `uz` - Uzbek (Latin)
        * `uz-Cyrl` - Uzbek (Cyrillic)
        * `ru` - Russian
        * `en` - English
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        email_verified:
          type: boolean
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
      - date_joined
      - email
      - email_verified
      - id
      - profile
      - role
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    OnboardingRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/OnboardingRoleEnum'
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        grade:
          type: integer
          maximum: 11
          minimum: 1
        subjects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 30
        grades:
          type: array
          items:
            type: integer
            maximum: 11
            minimum: 1
          maxItems: 11
      required:
      - display_name
      - role
    OnboardingRoleEnum:
      enum:
      - student
      - teacher
      type: string
      description: |-
        * `student` - student
        * `teacher` - teacher
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        refresh:
          type: string
      required:
      - new_password
    PasswordResetRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - token
    PatchedProfileUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        grade:
          type: integer
          maximum: 11
          minimum: 1
          nullable: true
        subjects:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 30
        grades:
          type: array
          items:
            type: integer
            maximum: 11
            minimum: 1
          maxItems: 11
    PatchedRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    Profile:
      type: object
      properties:
        display_name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          readOnly: true
        grade:
          type: integer
          readOnly: true
          nullable: true
        subjects:
          type: array
          items:
            type: string
          readOnly: true
        grades:
          type: array
          items:
            type: integer
          readOnly: true
        onboarded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - avatar_url
      - display_name
      - grade
      - grades
      - locale
      - onboarded_at
      - subjects
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        display_name:
          type: string
          maxLength: 60
        locale:
          $ref: '#/components/schemas/LocaleEnum'
      required:
      - email
      - password
    RoleEnum:
      enum:
      - student
      - teacher
      - editor
      - admin
      type: string
      description: |-
        * `student` - Student
        * `teacher` - Teacher
        * `editor` - Editor
        * `admin` - Admin
    StatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
