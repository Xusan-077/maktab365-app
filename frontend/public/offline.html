<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>darslik365</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        opacity: 0.8;
      }
      a,
      button {
        display: inline-block;
        min-height: 2.75rem;
        padding: 0.65rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #1554d1;
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="text"></p>
      <button id="retry" type="button"></button>
    </main>
    <script>
      var texts = {
        uz: ["Internet yo'q", "Bu sahifa hali oflayn saqlanmagan. Avval ko'rgan sahifalaringiz va «Oflayn saqlash» bilan saqlangan darsliklar internetsiz ochiladi.", "Qayta urinish"],
        ru: ["Нет интернета", "Эта страница ещё не сохранена офлайн. Ранее открытые страницы и учебники, сохранённые кнопкой «Сохранить офлайн», открываются без интернета.", "Повторить"],
        en: ["You are offline", "This page is not saved for offline use yet. Pages you opened before and books saved with “Save offline” open without internet.", "Try again"],
      };
      var lang = (navigator.language || "uz").slice(0, 2);
      var t = texts[lang] || texts.uz;
      document.documentElement.lang = texts[lang] ? lang : "uz";
      document.getElementById("title").textContent = t[0];
      document.getElementById("text").textContent = t[1];
      var retry = document.getElementById("retry");
      retry.textContent = t[2];
      retry.addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
