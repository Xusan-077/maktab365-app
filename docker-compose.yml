services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maktab365
      POSTGRES_PASSWORD: maktab365
      POSTGRES_DB: maktab365
    ports:
      # Host porti band bo'lsa (masalan, lokal Postgres): ildizdagi .env ga POSTGRES_PORT=55432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maktab365"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend: &backend
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment: &backend-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-only-secret-key
      DATABASE_URL: postgres://maktab365:maktab365@postgres:5432/maktab365
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGINS: http://localhost:3000
      # Dev/e2e: frontend `BACKEND_FORWARD_SECRET` bilan bir xil (prod'da env orqali, kuchli qiymat).
      FORWARDED_IP_SECRET: ${FORWARDED_IP_SECRET:-dev-forward-secret}
      # Dev/e2e: import qilingan draft kontent ochiq API'da "unverified" belgisi bilan ko'rinadi.
      SHOW_DRAFTS_PUBLICLY: ${SHOW_DRAFTS_PUBLICLY:-true}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: manba kod konteynerga ulanadi, .venv esa image ichida qoladi.
      - ./backend:/app
      - /app/.venv
      # Kontent importi: `python manage.py import_content /content` (e2e global-setup shuni chaqiradi).
      - ./frontend/src/content:/content:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: watchfiles --filter python "celery -A config worker -l info" /app
    ports: []
    depends_on:
      - backend

volumes:
  postgres-data:
